

name: Build Ayah of the Day APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android.yml'
      - 'ayah_of_the_day_android_project.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o ayah_of_the_day_android_project.zip -d extracted
          echo "Files extracted:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find project directory
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: .
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/
